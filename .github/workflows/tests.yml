name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check command entry points
        run: |
          python scripts/workflow.py --help
          python scripts/task_queue.py --help
          python scripts/survey_audit.py --help
          python scripts/score_review.py --help
          python install.py --dry-run
      - name: Verify offline install and agent adapter
        shell: bash
        run: |
          python install.py --target-root "$RUNNER_TEMP/survey-shared" --agent-root "$RUNNER_TEMP/survey-agent" --mode copy
          python install.py --target-root "$RUNNER_TEMP/survey-shared" --agent-root "$RUNNER_TEMP/survey-agent" --verify
      - name: Verify Windows PowerShell wrapper
        if: runner.os == 'Windows'
        shell: powershell
        run: ./install.ps1 -TargetRoot "$env:RUNNER_TEMP\survey-powershell" -DryRun
